name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: rustfmt, clippy
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Engine tests (headless crates)
        run: cargo test --workspace
      - name: Clippy (engine)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build desktop app
        # The two helper binaries ship beside the app in the
        # Windows bundle; build them in release here too, so a
        # helper that stops compiling is caught on main, not at
        # bundle time (audit Batch 3, red-team M11).
        run: cargo build --release -p openbulletin -p openbulletin-cli -p ob-pdfium-helper -p ob-verovio-helper
