name: Windows bundle

# Builds the one-download Windows bundle Jacob asked for by
# experience: openbulletin.exe + ob-pdfium-helper.exe + pdfium.dll
# in a single zip. No installer, no steps: unzip, double-click.
# ob-verovio-helper.exe rides along too: it is our own binary,
# the door to the music engraver. The engraver itself (Verovio)
# rides along as well, since round 51 (R51-C): it publishes no
# standalone Windows binary (its Windows form is a Python
# wheel), so the bundle stages the official wheel plus a Python
# runtime as verovio-python/ beside the exe, the exact folder
# the helper already probes; see docs/LEGAL.md. If that folder
# is ever deleted, music files still open with their notes
# standing undrawn and the app says so plainly.
#
# Audit Batch 3 hardening (docs/planning/
# audit-wave3-synthesis-2026-10-16.md, red-team M11): the gate
# job must pass before anything is built or published; the
# PDFium download is checked against its recorded SHA-256;
# staging runs with stop-on-error and a named-file assertion
# afterwards, so a green run can no longer ship a zip that is
# quietly missing the PDF library or its license; third-party
# actions are pinned to full commit SHAs; the write permission
# lives only on the job that creates the release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    name: Gate (format, tests, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: rustfmt, clippy
      - name: Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Workspace tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  bundle:
    needs: gate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the app and the PDF reader
        run: cargo build --release -p openbulletin -p ob-pdfium-helper -p ob-verovio-helper
      - name: Fetch the PDFium library (pinned, chromium 8100) and check its hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8100/pdfium-win-x64.tgz" -OutFile pdfium.tgz
          # SHA-256 of pdfium-win-x64.tgz from the chromium/8100
          # release, as published in the GitHub release API's
          # asset digest and confirmed against a local download
          # on 2026-10-16. If the asset is ever re-issued, this
          # check fails loudly instead of shipping unknown bytes.
          $expected = '51621bcc1d9be9ea448f4b84b0516862b928e3968d3fca899af1a6d6e2848d6d'
          $actual = (Get-FileHash pdfium.tgz -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "PDFium download does not match its recorded hash. Got $actual, expected $expected."
          }
          tar -xzf pdfium.tgz
          Get-ChildItem -Recurse | Select-Object FullName
      - name: Fetch the Verovio engraver (pinned wheel + Python runtime)
        shell: pwsh
        run: |
          # Stages verovio-python/ (embeddable Python + the
          # official wheel, both SHA-256-checked), the wheel's
          # own LGPL-3.0 text, and the source offer, into
          # bundle/; fails loudly on any hash or license
          # mismatch. The same script proves the same shape
          # on the CI Windows leg (see ci.yml).
          ./scripts/stage-verovio-windows.ps1 -BundleDir bundle
      - name: Stage the bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force bundle | Out-Null
          Copy-Item target/release/openbulletin.exe bundle/
          Copy-Item target/release/ob-pdfium-helper.exe bundle/
          Copy-Item target/release/ob-verovio-helper.exe bundle/
          Copy-Item crates/ob-app/assets/icon.png bundle/
          Copy-Item crates/ob-app/assets/icon/openbulletin.ico bundle/
          Copy-Item bin/pdfium.dll bundle/
          # The PDFium license ships inside the PDFium tarball
          # itself, as the LICENSE file at its root (extracted
          # above into the working folder). It is not a file in
          # this repository; naming it here, and the assertion
          # step below, keeps that from ever passing silently.
          Copy-Item LICENSE bundle/PDFium-LICENSE.txt
          @"
          OpenBulletin for Windows
          ========================
          Unzip this folder anywhere (your Desktop is fine) and
          double-click openbulletin.exe. There is nothing to
          install. The three other programs in the folder work
          for openbulletin.exe: ob-pdfium-helper.exe reads PDF
          files with the pdfium.dll library, and
          ob-verovio-helper.exe is the door to the music
          engraver. Keep them beside openbulletin.exe. The
          icon.png file is the program's picture, the same one
          the window wears; it does not need to stay. The
          openbulletin.ico file is the same picture for a
          shortcut: if you make a shortcut to openbulletin.exe,
          you can point its icon at that file.

          Music files (MusicXML) open through the same door, and
          their notes are drawn by a music engraver program
          (Verovio) in the verovio-python folder beside
          openbulletin.exe: the official Verovio wheel plus a
          Python runtime to run it, unmodified, with its
          LGPL-3.0 license text (Verovio-LGPL-3.0.txt) and a
          note offering its source (Verovio-SOURCE.txt).
          Keep the verovio-python folder beside
          openbulletin.exe. If it is ever missing, a music
          file still opens: its title, words, and credit
          arrive, and the app tells you plainly that the
          notes cannot be drawn on this computer yet.

          Your bulletins stay on this computer; the app does not
          send them anywhere. The one time the app uses the
          network is when you ask it for more fonts: it fetches
          the list of free fonts and the fonts you pick, and
          nothing else.
          "@ | Out-File -Encoding utf8 bundle/README.txt
          Compress-Archive -Path bundle/* -DestinationPath openbulletin-windows.zip
      - name: Check the staged bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'openbulletin.exe',
            'ob-pdfium-helper.exe',
            'ob-verovio-helper.exe',
            'pdfium.dll',
            'PDFium-LICENSE.txt',
            'README.txt',
            'icon.png',
            'openbulletin.ico',
            'verovio-python/python.exe',
            'Verovio-LGPL-3.0.txt',
            'Verovio-SOURCE.txt'
          )
          foreach ($name in $required) {
            $file = Get-Item "bundle/$name"
            if ($file.Length -eq 0) {
              throw "bundle/$name is empty; the bundle must not ship like this."
            }
          }
          # The wheel itself, unpacked where the staged
          # runtime looks for it, and the runtime's import
          # path naming it: a folder without either would
          # pass the file list above and still engrave
          # nothing.
          $wheelMain = Get-Item 'bundle/verovio-python/Lib/site-packages/verovio/verovio.py'
          if ($wheelMain.Length -eq 0) {
            throw 'The staged Verovio wheel is empty; the bundle must not ship like this.'
          }
          $pth = Get-Item 'bundle/verovio-python/python*._pth'
          if ((Get-Content $pth.FullName -Raw) -notmatch 'Lib/site-packages') {
            throw 'The staged Python import path does not name site-packages; the wheel would not import.'
          }
          Get-ChildItem bundle | Select-Object Name, Length
      - name: End-to-end music check (staged bundle)
        shell: pwsh
        run: |
          # MusicXML in, engraved SVG out, staff at or above
          # the 5.0 mm floor, through the staged folder with
          # PATH scrubbed and no overrides: the stock-Windows
          # proof for this bundle. Runs after the zip is made
          # but before anything uploads, so a failing check
          # ships nothing.
          ./scripts/check-verovio-bundle.ps1 -BundleDir bundle -HelperExe bundle/ob-verovio-helper.exe -MusicXml scripts/verovio-e2e-sample.musicxml
      - name: Upload the bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openbulletin-windows
          path: openbulletin-windows.zip
      - name: Attach to a release when tagged
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: openbulletin-windows.zip
