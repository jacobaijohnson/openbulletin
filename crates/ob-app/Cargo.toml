[package]
name = "openbulletin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OpenBulletin desktop app (egui shell over the headless engine crates)."

[[bin]]
name = "openbulletin"
path = "src/main.rs"

[dependencies]
ob-model = { path = "../ob-model" }
ob-layout = { path = "../ob-layout" }
ob-text = { path = "../ob-text" }
ob-pdf = { path = "../ob-pdf" }
ob-extract = { path = "../ob-extract" }
ob-impose = { path = "../ob-impose" }
ob-format = { path = "../ob-format" }
ob-fonts = { path = "../ob-fonts" }
ob-image = { path = "../ob-image" }
ob-clips = { path = "../ob-clips" }
ob-music = { path = "../ob-music" }
rfd = "0.15"
serde.workspace = true
serde_json.workspace = true
eframe = "0.29"
chrono.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
