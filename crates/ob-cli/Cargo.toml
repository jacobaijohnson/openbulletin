[package]
name = "openbulletin-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OpenBulletin headless CLI: new, export-pdf, next-sunday, info. The CI oracle for the engine."

[[bin]]
name = "openbulletin-cli"
path = "src/main.rs"

[dependencies]
ob-model = { path = "../ob-model" }
ob-layout = { path = "../ob-layout" }
ob-format = { path = "../ob-format" }
ob-pdf = { path = "../ob-pdf" }
ob-impose = { path = "../ob-impose" }
ob-fonts = { path = "../ob-fonts" }
ob-extract = { path = "../ob-extract" }
chrono.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
ob-text = { path = "../ob-text" }
