[package]
name = "ob-clips"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OpenBulletin clip art library: named collections of picture files, copied in and never live-linked, after the font library's pattern."

[dependencies]
ob-model = { path = "../ob-model" }
ob-image = { path = "../ob-image" }
ob-fonts = { path = "../ob-fonts" }
serde.workspace = true
serde_json.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
