[package]
name = "ob-extract"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OpenBulletin import extraction: turns foreign bulletin files into the versioned extraction dump (schema v2) the Template Analyzer reads — PDF through the PDFium helper, IDML, Scribus, and Publisher in-process — and imports HTML in-process."

[dependencies]
serde.workspace = true
serde_json.workspace = true
lopdf = "0.34"
ob-model = { path = "../ob-model" }
ob-fonts = { path = "../ob-fonts" }
ob-image = { path = "../ob-image" }
ob-runner = { path = "../ob-runner" }
base64 = "0.22"
quick-xml = "0.36"
html5ever = "0.39"
markup5ever_rcdom = "0.39"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "2", default-features = false, features = ["deflate"] }


[dev-dependencies]
ob-layout = { path = "../ob-layout" }
ob-pdf = { path = "../ob-pdf" }
chrono.workspace = true

[lints]
workspace = true
