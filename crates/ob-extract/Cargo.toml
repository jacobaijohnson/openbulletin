[package]
name = "ob-extract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OpenBulletin import extraction: turns PDF (later .pub, IDML) files into a versioned JSON dump that the Template Analyzer reads."

[dependencies]
serde.workspace = true
serde_json.workspace = true
lopdf = "0.34"
ob-model = { path = "../ob-model" }

[dev-dependencies]
ob-layout = { path = "../ob-layout" }
ob-pdf = { path = "../ob-pdf" }
chrono.workspace = true
