[package]
name = "ob-extract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OpenBulletin import extraction: turns PDF (later .pub, IDML) files into a versioned JSON dump that the Template Analyzer reads."

[dependencies]
serde.workspace = true
serde_json.workspace = true
lopdf = "0.34"
ob-model = { path = "../ob-model" }
ob-image = { path = "../ob-image" }
base64 = "0.22"
quick-xml = "0.36"
html5ever = "0.39"
markup5ever_rcdom = "0.39"
zip = { version = "2", default-features = false, features = ["deflate"] }

# The shared helper runner stops a timed-out helper's
# whole process group on Unix (runner.rs), so a helper
# that is itself a wrapper script cannot leave its own
# children holding the pipes open.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
ob-layout = { path = "../ob-layout" }
ob-pdf = { path = "../ob-pdf" }
chrono.workspace = true
