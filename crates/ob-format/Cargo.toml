[package]
name = "ob-format"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OpenBulletin file format: .obd documents (v0: JSON; v1: zip container with the same document.json plus content-addressed assets)."

[dependencies]
ob-model = { path = "../ob-model" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
