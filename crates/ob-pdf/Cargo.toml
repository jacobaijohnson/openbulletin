[package]
name = "ob-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OpenBulletin PDF export: a small self-contained PDF 1.4 writer (reader and imposed sheets)."

[dependencies]
ob-model = { path = "../ob-model" }
ob-text = { path = "../ob-text" }
ob-fonts = { path = "../ob-fonts" }
ob-impose = { path = "../ob-impose" }
ob-image = { path = "../ob-image" }
# variable-fonts: the wght-instantiation path (instantiate.rs) reads
# varied outlines and advances through ttf-parser's variation API.
# With no variation coordinates set, every other read is unchanged.
ttf-parser = { version = "0.25", features = ["variable-fonts"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
subsetter = "0.2.6"

[dev-dependencies]
lopdf = "0.34"
ob-layout = { path = "../ob-layout" }
chrono.workspace = true

[lints]
workspace = true
