[package]
name = "ob-pdf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OpenBulletin PDF export: a small self-contained PDF 1.4 writer (reader and imposed sheets)."

[dependencies]
ob-model = { path = "../ob-model" }
ob-text = { path = "../ob-text" }
ob-fonts = { path = "../ob-fonts" }
ob-impose = { path = "../ob-impose" }
ob-image = { path = "../ob-image" }
ttf-parser = "0.25"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
subsetter = "0.2.6"

[dev-dependencies]
lopdf = "0.34"
ob-layout = { path = "../ob-layout" }
chrono.workspace = true
