[package]
name = "ob-pdfium-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OpenBulletin's PDFium helper: runs PDFium out-of-process, answers with the versioned extraction dump (schema v2), and renders page pictures for tracing guides."

[dependencies]
ob-extract = { path = "../ob-extract" }
pdfium-render = "0.8"
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
